name: Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # v3 默认安装 "tools platform-tools"；tools 包已被 Google 仓库移除，
          # 保持默认会直接报 "Failed to find package 'tools'" 而中断 setup。
          # 只保留仍有效的 platform-tools，其余组件在下一步显式安装。
          packages: "platform-tools"

      - name: Install SDK components
        run: |
          set -euo pipefail
          # 包路径以 SDK 实际登记为准：compileSdk 37 对应 platforms;android-37.0
          # （Android 17 / API 37.0），不是 platforms;android-37。
          sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # CI 不持有正式私钥：每次生成一次性 keystore，仅验证 release 可签名构建，产物不可分发。
      - name: Prepare CI-only signing keystore
        run: |
          set -euo pipefail
          STORE_PASS="$(openssl rand -hex 16)"
          keytool -genkeypair -keystore "$RUNNER_TEMP/ci-release.jks" -storetype PKCS12 \
            -alias ci -keyalg RSA -keysize 2048 -validity 1 \
            -dname "CN=CI Build Only" -storepass "$STORE_PASS" -keypass "$STORE_PASS"
          {
            echo "storeFile=$RUNNER_TEMP/ci-release.jks"
            echo "storePassword=$STORE_PASS"
            echo "keyAlias=ci"
            echo "keyPassword=$STORE_PASS"
          } > keystore.properties

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Lint
        run: ./gradlew lintDebug --console=plain

      - name: Release build (R8)
        run: ./gradlew assembleRelease --console=plain

      # 联网范围的可执行证据（见 D59）：允许 INTERNET，但源码主机必须落在白名单内。
      # 能力边界：这是对 app/src/main/java 的文本扫描，能拦住直接写死的域名，
      # 拦不住运行时拼接的域名、重定向后的主机、原生库内部的请求；
      # 它是低成本的回归门禁，不是「绝不联网」的强保证。
      - name: Check network scope
        run: |
          set -euo pipefail
          AAPT2="$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | head -n1)"
          "$AAPT2" dump permissions app/build/outputs/apk/release/app-release.apk | tee permissions.txt
          if ! grep -q "android.permission.INTERNET" permissions.txt; then
            echo "::error::缺少 INTERNET 权限：更新检查将无法访问 GitHub Releases"
            exit 1
          fi
          echo "OK: merged manifest declares INTERNET"

          hosts="$(grep -rhoE 'https?://[A-Za-z0-9._-]+' app/src/main/java \
            | sed -E 's#^https?://##' | tr '[:upper:]' '[:lower:]' | sort -u)"
          echo "hosts found in app/src/main/java:"
          echo "$hosts"
          allowed="api.github.com github.com"
          failed=0
          while IFS= read -r host; do
            [ -z "$host" ] && continue
            if ! echo "$allowed" | tr ' ' '\n' | grep -qx "$host"; then
              echo "::error::源码中出现白名单外的主机：$host（仅允许 $allowed）"
              failed=1
            fi
          done <<< "$hosts"
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo "OK: all source hosts are allow-listed"

      # 产物仅供 CI 内验证与人工下载核对，使用一次性 CI 签名，不能作为对外发布包。
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: daily-trace-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
